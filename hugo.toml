baseURL = "https://diapraesentation.projektemacher.org/"
locale = "de"
title = "Diapräsentation"
publishDir = "docs"
canonifyURLs = true
disableKinds = ["term", "taxonomy"]
defaultContentLanguage = "de"
enableGitInfo = true
theme = ["observer-hugo", "projektemacher-base"]

[languages]
    [languages.de]
        label = "Deutsch"
        locale = "de"

        [languages.de.params]
            description = "Diaprojektor statt PowerPoint"

        [languages.de.menu]
            [[languages.de.menu.main]]
                name = "Start"
                weight = 1
                url = "/"

            [[languages.de.menu.main]]
                name = "Über"
                weight = 2
                url = "about/"

    [languages.en]
        label = "English"
        locale = "en"

        [languages.en.params]
            description = "Slide projector instead of PowerPoint"

        [languages.en.menu]
            [[languages.en.menu.main]]
                name = "Home"
                weight = 1
                url = "/"

            [[languages.en.menu.main]]
                name = "About"
                weight = 2
                url = "about/"

[markup]
    defaultMarkdownHandler = 'goldmark'

[markup.goldmark]
    [markup.goldmark.renderer]
        unsafe= true

    [markup.goldmark.extensions]
        attribute = true
        strikethrough = true

    [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.insert]
            enable = true
        [markup.goldmark.extensions.extras.mark]
            enable = true
        [markup.goldmark.extensions.extras.subscript]
            enable = true
        [markup.goldmark.extensions.extras.superscript]
            enable = true

    [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '&ldquo;'
        leftSingleQuote = '&lsquo;'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '&rdquo;'
        rightSingleQuote = '&rsquo;'

    [markup.goldmark.parser]
        autoHeadingID = true
        autoHeadingIDType = "github"

[module]
    [[module.mounts]]
        source = "assets/scss"
        target = "assets/scss"

    [[module.mounts]]
        source = "static"
        target = "static"

    [[module.mounts]]
        source = "node_modules/pdfjs-dist"
        target = "static/js/pdfjs"

[build]
  writeStats = true
